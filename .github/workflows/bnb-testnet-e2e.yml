name: BNB Testnet ROSCA E2E

on:
  workflow_dispatch:
    inputs:
      testnet_wallet_address:
        description: "Your MetaMask BNB Testnet wallet address (public address only)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  testnet-e2e:
    name: Run BNB Testnet ROSCA cycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout BNB application branch
        uses: actions/checkout@v4
        with:
          ref: bnb-app-complete

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Validate MetaMask deployer wallet
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          TESTNET_WALLET_ADDRESS: ${{ inputs.testnet_wallet_address }}
        run: |
          test -n "$DEPLOYER_PRIVATE_KEY" || {
            echo "DEPLOYER_PRIVATE_KEY GitHub Actions secret is missing."
            echo "Set it to the private key of the MetaMask wallet used as the BNB Testnet deployer/funder."
            exit 1
          }
          node - <<'NODE'
          const { Wallet, getAddress } = require("ethers");
          const expected = process.env.TESTNET_WALLET_ADDRESS;
          const wallet = new Wallet(process.env.DEPLOYER_PRIVATE_KEY);
          if (!expected) throw new Error("MetaMask testnet wallet address is required.");
          if (getAddress(expected) !== wallet.address) {
            throw new Error("The MetaMask wallet address does not match DEPLOYER_PRIVATE_KEY.");
          }
          console.log("MetaMask testnet wallet address verified:", wallet.address);
          NODE

      - name: Run controlled Testnet ROSCA cycle
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
          BNB_CONTRACT_ADDRESS: "0xe9b104260c940fAE26a73e4E9c952fD18fFd2014"
          TEST_TOKEN_CONTRACT: "0xb516a4a0ec39e3CBa5baDAE5524E05F43EB66C29"
        run: node scripts/e2e-testnet.js
