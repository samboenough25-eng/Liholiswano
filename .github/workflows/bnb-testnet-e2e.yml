name: BNB Testnet ROSCA E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bnb-testnet-e2e.yml"
  workflow_dispatch:
    inputs:
      testnet_wallet_address:
        description: "Existing BNB Testnet deployer wallet public address"
        required: false
        default: "0xb6eB25C6C2C158dcCCA3fE358e6d1EdC784F11D6"
        type: string

permissions:
  contents: read

jobs:
  testnet-e2e:
    name: Run fresh BNB Testnet ROSCA cycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout BNB application branch
        uses: actions/checkout@v4
        with:
          ref: bnb-app-complete

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Validate MetaMask deployer wallet
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          TESTNET_WALLET_ADDRESS: ${{ inputs.testnet_wallet_address || '0xb6eB25C6C2C158dcCCA3fE358e6d1EdC784F11D6' }}
        run: |
          test -n "$DEPLOYER_PRIVATE_KEY" || {
            echo "DEPLOYER_PRIVATE_KEY GitHub Actions secret is missing."
            exit 1
          }
          node - <<'NODE'
          const { Wallet, getAddress } = require("ethers");
          const expected = process.env.TESTNET_WALLET_ADDRESS;
          const wallet = new Wallet(process.env.DEPLOYER_PRIVATE_KEY);
          if (!expected) throw new Error("BNB Testnet deployer wallet address is required.");
          if (getAddress(expected) !== wallet.address) {
            throw new Error("The wallet address does not match DEPLOYER_PRIVATE_KEY.");
          }
          console.log("Existing BNB Testnet deployer wallet verified:", wallet.address);
          NODE

      - name: Normalize BNB Testnet RPC
        env:
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
        run: |
          RPC="$(printf '%s' "$BSC_TESTNET_RPC_URL" | tr -d '\r\n')"
          if [ -z "$RPC" ]; then
            RPC="https://data-seed-prebsc-1-s1.bnbchain.org:8545"
          fi
          case "$RPC" in
            http://*|https://*) ;;
            *) echo "BSC_TESTNET_RPC_URL is not a valid HTTP(S) URL after normalization."; exit 1 ;;
          esac
          echo "BSC_TESTNET_RPC_URL=$RPC" >> "$GITHUB_ENV"
          echo "BNB Testnet RPC normalized successfully."

      - name: Compile BNB contracts
        run: npm run compile

      - name: Deploy a fresh isolated Testnet stack
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          SUBSCRIPTION_TREASURY_ADDRESS: ${{ inputs.testnet_wallet_address || '0xb6eB25C6C2C158dcCCA3fE358e6d1EdC784F11D6' }}
          SUBSCRIPTIONS_ENABLED: "false"
        run: |
          npx hardhat run scripts/deploy.js --network bscTestnet | tee deploy.out
          grep '^LIHOLISWANO_CONTRACT=' deploy.out >> "$GITHUB_ENV"
          grep '^SUBSCRIPTION_CONTRACT=' deploy.out | sed 's/^SUBSCRIPTION_CONTRACT=/SUBSCRIPTION_CONTRACT_ADDRESS=/' >> "$GITHUB_ENV"
          grep '^TEST_TOKEN_CONTRACT=' deploy.out >> "$GITHUB_ENV"
          grep '^SUBSCRIPTION_TREASURY=' deploy.out | sed 's/^SUBSCRIPTION_TREASURY=/EXPECTED_SUBSCRIPTION_TREASURY=/' >> "$GITHUB_ENV"
          echo "Fresh Testnet deployment addresses captured."

      - name: Run controlled Testnet ROSCA cycle
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          SUBSCRIPTIONS_ENABLED: "false"
        run: node scripts/e2e-testnet.js
