name: BNB Testnet ROSCA E2E

on:
  workflow_dispatch:
    inputs:
      testnet_wallet_address:
        description: "Your MetaMask BNB Testnet wallet address (public address only)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  testnet-e2e:
    name: Run fresh BNB Testnet ROSCA cycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout BNB application branch
        uses: actions/checkout@v4
        with:
          ref: bnb-app-complete

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Validate MetaMask deployer wallet
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          TESTNET_WALLET_ADDRESS: ${{ inputs.testnet_wallet_address }}
        run: |
          test -n "$DEPLOYER_PRIVATE_KEY" || {
            echo "DEPLOYER_PRIVATE_KEY GitHub Actions secret is missing."
            echo "Use the private key belonging to the existing BNB Testnet deployer wallet."
            exit 1
          }
          node - <<'NODE'
          const { Wallet, getAddress } = require("ethers");
          const expected = process.env.TESTNET_WALLET_ADDRESS;
          const wallet = new Wallet(process.env.DEPLOYER_PRIVATE_KEY);
          if (!expected) throw new Error("MetaMask testnet wallet address is required.");
          if (getAddress(expected) !== wallet.address) {
            throw new Error("The MetaMask wallet address does not match DEPLOYER_PRIVATE_KEY.");
          }
          console.log("MetaMask testnet wallet address verified:", wallet.address);
          NODE

      - name: Compile BNB contracts
        env:
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL || 'https://data-seed-prebsc-1-s1.bnbchain.org:8545' }}
        run: npm run compile

      - name: Deploy a fresh isolated Testnet stack
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL || 'https://data-seed-prebsc-1-s1.bnbchain.org:8545' }}
          SUBSCRIPTION_TREASURY_ADDRESS: ${{ inputs.testnet_wallet_address }}
          SUBSCRIPTIONS_ENABLED: "false"
        run: |
          npx hardhat run scripts/deploy.js --network bscTestnet | tee deploy.out
          grep '^LIHOLISWANO_CONTRACT=' deploy.out >> "$GITHUB_ENV"
          grep '^SUBSCRIPTION_CONTRACT=' deploy.out | sed 's/^SUBSCRIPTION_CONTRACT=/SUBSCRIPTION_CONTRACT_ADDRESS=/' >> "$GITHUB_ENV"
          grep '^TEST_TOKEN_CONTRACT=' deploy.out >> "$GITHUB_ENV"
          grep '^SUBSCRIPTION_TREASURY=' deploy.out | sed 's/^SUBSCRIPTION_TREASURY=/EXPECTED_SUBSCRIPTION_TREASURY=/' >> "$GITHUB_ENV"

      - name: Run controlled Testnet ROSCA cycle
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL || 'https://data-seed-prebsc-1-s1.bnbchain.org:8545' }}
          BNB_CONTRACT_ADDRESS: ${{ env.LIHOLISWANO_CONTRACT }}
          SUBSCRIPTION_CONTRACT_ADDRESS: ${{ env.SUBSCRIPTION_CONTRACT_ADDRESS }}
          TEST_TOKEN_CONTRACT: ${{ env.TEST_TOKEN_CONTRACT }}
          EXPECTED_SUBSCRIPTION_TREASURY: ${{ env.EXPECTED_SUBSCRIPTION_TREASURY }}
          SUBSCRIPTIONS_ENABLED: "false"
        run: node scripts/e2e-testnet.js
