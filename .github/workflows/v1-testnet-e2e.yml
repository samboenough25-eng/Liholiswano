name: V1 BNB Testnet Deployment and E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liholiswano-v1-testnet
  cancel-in-progress: false

jobs:
  deploy-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.2-conformance-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"
          cache: npm
      - run: npm ci
      - name: Validate deployment configuration
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
        run: |
          test -n "$DEPLOYER_PRIVATE_KEY" || { echo "DEPLOYER_PRIVATE_KEY is missing"; exit 1; }
          if [ -z "$BSC_TESTNET_RPC_URL" ]; then
            echo "BSC_TESTNET_RPC_URL is missing"; exit 1
          fi
      - name: Compile and run local conformance tests
        run: npm run check:all
      - name: Fresh V1 Testnet deployment + multi-wallet E2E
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
          V1_E2E_MIN_DEPLOYER_BNB: "0.08"
          V1_E2E_WALLET_BNB: "0.004"
        run: npx hardhat run scripts/e2e-testnet-v1.js --network bscTestnet
