name: BNB application CI

on:
  push:
    branches: [bnb-app-complete]
  pull_request:
    branches: [bnb-app-complete]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
      - name: Bootstrap dependency lockfile when missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git diff --cached --quiet || git commit -m "chore: bootstrap npm lockfile"
            git push
          fi
      - name: Require dependency lockfile
        run: test -f package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: JavaScript/API checks
        run: npm run check:js && npm run api:check
      - name: Contract tests
        run: npm test
      - name: Web validation
        run: npm run validate:web
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
