name: BNB compile and test
on:
  push:
    branches: [main,bnb-v1,bnb-app-complete]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check:js
      - run: npm run api:check
      - run: npm run compile
      - run: npm test
      - run: npm run e2e:local
      - run: npm run validate:web
      - name: Run BNB Testnet ROSCA cycle
        if: contains(github.event.head_commit.message, '[testnet-e2e]')
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
          BNB_CONTRACT_ADDRESS: 0xe9b104260c940fAE26a73e4E9c952fD18fFd2014
          TEST_TOKEN_CONTRACT: 0xb516a4a0ec39e3CBa5baDAE5524E05F43EB66C29
        run: node scripts/e2e-testnet.js
