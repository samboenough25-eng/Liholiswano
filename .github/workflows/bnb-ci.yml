name: BNB compile and test

on:
  push:
    branches: [main, bnb-v1, bnb-app-complete]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: JavaScript syntax
        run: npm run check:js

      - name: API syntax
        run: npm run api:check

      - name: Solidity compile
        run: npm run compile

      - name: Contract tests
        run: npm test

      - name: Local ROSCA E2E
        run: npm run e2e:local

      - name: Web validation
        run: npm run validate:web
