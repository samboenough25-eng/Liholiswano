<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liholiswano — Create account</title><style>
body{margin:0;background:#f5f7f6;color:#17211b;font:15px system-ui,Segoe UI,sans-serif}.wrap{max-width:560px;margin:auto;padding:40px 16px}.card{background:#fff;border:1px solid #dbe5df;border-radius:16px;padding:24px}h1{margin-top:0}label{display:block;font-size:12px;color:#66736b;margin:14px 0 5px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd8d1;border-radius:9px}button{margin-top:16px;padding:12px 16px;border:0;border-radius:9px;background:#087f5b;color:white;font-weight:800;cursor:pointer}.status{margin-top:16px;padding:12px;border-radius:9px;background:#eef5f0;white-space:pre-wrap}.err{background:#fff0ef;color:#8f211c}.small{font-size:12px;color:#66736b}a{color:#087f5b}</style></head><body><main class="wrap"><div class="card">
<h1>Create your Liholiswano account</h1><p class="small">Register with your email and start using the waiting-list platform. Email verification is disabled for the current testnet pilot. Never enter a seed phrase or private key.</p>
<label>Email</label><input id="email" type="email" autocomplete="email" required>
<label>Password</label><input id="password" type="password" autocomplete="new-password" minlength="12" required>
<label>Country</label><select id="country"><option value="BW">Botswana</option><option value="SZ">Eswatini</option></select>
<label>Phone (optional)</label><input id="phone" autocomplete="tel">
<button id="register">Create account &amp; continue</button><div id="status" class="status">Ready.</div>
<p class="small"><a href="./dashboard.html">Already have an account? Open account</a></p></div></main><script>
const API="https://liholiswano-bnb-api.onrender.com", $=id=>document.getElementById(id);
$("register").onclick=async()=>{const s=$("status");try{const email=$("email").value.trim().toLowerCase(),password=$("password").value,country=$("country").value,phone=$("phone").value.trim()||undefined;if(password.length<12)throw Error("Password must be at least 12 characters.");const r=await fetch(API+"/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password,country,phone})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Registration failed");localStorage.setItem("lhs_token",d.token||"");s.textContent="Account created. You are signed in. Opening your account…";setTimeout(()=>location.href="./dashboard.html",500)}catch(e){s.className="status err";s.textContent=e.message}};
</script></body></html>
