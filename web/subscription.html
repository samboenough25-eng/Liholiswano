<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liholiswano Subscription</title>
<style>body{font:16px system-ui;margin:0;background:#f5f7f6;color:#17211b}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dbe5df;border-radius:12px;padding:18px;margin:14px 0}button{padding:11px 14px;border:0;border-radius:8px;background:#087f5b;color:#fff;font-weight:700}.status{white-space:pre-wrap;word-break:break-word;background:#eef5f0;padding:12px;border-radius:8px}</style></head>
<body><main class="wrap"><h1>Monthly Liholiswano subscription</h1><p>This page is a wallet-signing surface opened from WhatsApp. WhatsApp remains the customer interface; the wallet is only used to explicitly authorize the blockchain transaction.</p><div class="card"><div id="details">Loading…</div><button id="connect">Connect wallet</button> <button id="pay">Authorize and pay</button><div id="status" class="status">Not connected.</div></div>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script><script>
const API="https://liholiswano-bnb-api.onrender.com";const params=new URLSearchParams(location.search);const request=params.get("request");let authToken=params.get("token");let provider,signer,address,payment;
function show(x){document.getElementById("status").textContent=typeof x==="string"?x:JSON.stringify(x,null,2)}
async function load(){if(!request||!authToken)return show("Invalid authorization link.");const r=await fetch(API+"/api/whatsapp/authorization/"+encodeURIComponent(authToken));const d=await r.json();if(!r.ok)return show(d.error||"Authorization request unavailable");payment=d;document.getElementById("details").textContent="Subscription "+d.fiatLabel+" for "+d.period+" • "+d.tokenAmount+" token base units";}
async function connect(){if(!window.ethereum)return show("Open this page in a BNB-compatible wallet browser.");provider=new ethers.BrowserProvider(window.ethereum);signer=await provider.getSigner();address=await signer.getAddress();show("Wallet connected: "+address);}
async function pay(){try{if(!payment)await load();if(!signer)await connect();const net=await provider.getNetwork();if(net.chainId!==BigInt(payment.chainId))throw Error("Switch to BNB Smart Chain testnet.");if(address.toLowerCase()!==payment.walletAddress.toLowerCase())throw Error("Use the verified wallet linked to this Liholiswano account.");
const token=new ethers.Contract(payment.token,["function approve(address,uint256) returns(bool)","function allowance(address,address) view returns(uint256)"],signer);
const app=new ethers.Contract(payment.contract,["function paySubscription(bytes32,bytes32,uint256,uint256)"],signer);
const allowance=await token.allowance(address,payment.contract);if(allowance<BigInt(payment.amount)){show("Approve the subscription contract in your wallet…");const a=await token.approve(payment.contract,payment.amount);await a.wait();}
show("Confirm the subscription payment in your wallet…");const tx=await app.paySubscription(payment.subscriptionKey,payment.customerKey,payment.periodStart,payment.amount);show("Submitted: "+tx.hash+"\nWaiting for confirmation…");await tx.wait();
const tokenValue=localStorage.getItem("lhs_token");if(!tokenValue)throw Error("Sign in to the Liholiswano account in this browser first.");const r=await fetch(API+"/api/subscription/record",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+tokenValue},body:JSON.stringify({paymentId:payment.paymentId,txHash:tx.hash})});const d=await r.json();if(!r.ok)throw Error(d.error||"Unable to record payment");show("Payment confirmed.\n"+JSON.stringify(d,null,2));}catch(e){show(e.shortMessage||e.message||String(e))}}
document.getElementById("connect").onclick=connect;document.getElementById("pay").onclick=pay;load();
</script></main></body></html>
